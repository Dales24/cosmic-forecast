<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Cosmic Forecast</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/config.js"></script>
</head>
<body class="page-mode">
  <script>
    // Apply the saved theme (shared with the map page) before content paints.
    (function () {
      var t = null;
      try { t = localStorage.getItem(window.COSMIC.THEME_KEY); } catch (e) { /* ignore */ }
      document.body.classList.add("theme-" + (t || "default"));
    })();
  </script>

  <nav class="top-nav">
    <a href="/">Map</a>
    <a href="/help">Help</a>
    <a href="/profile">Profile</a>
  </nav>

  <main class="page">
    <h1>Profile</h1>
    <p class="lead">Your account, preferences, and saved work.</p>

    <div class="page-card">
      <h2>Account</h2>
      <div id="account"><p class="profile-empty">Loading…</p></div>
    </div>

    <div class="page-card saved-section">
      <h2>Saved searches</h2>
      <div id="searches"><p class="profile-empty">Loading…</p></div>
    </div>

    <div class="page-card saved-section">
      <h2>Saved uploads</h2>
      <div id="uploads"><p class="profile-empty">Loading…</p></div>
    </div>
  </main>

  <script src="/static/profile.js"></script>
</body>
</html>
