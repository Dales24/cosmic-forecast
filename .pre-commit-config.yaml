# All hooks run from the project venv (`uv run`) instead of pre-commit-managed
# virtualenvs. Smart App Control on Windows blocks the unsigned python.exe that
# virtualenv copies into each managed env; running from the already-synced venv
# sidesteps that. Tool versions are pinned in pyproject.toml [dependency-groups].
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        # Ignore list lives in .flake8 so CI and pre-commit stay in sync.

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run python -m pre_commit_hooks.end_of_file_fixer
        language: system

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run check-merge-conflict
        language: system

      - id: check-added-large-files
        name: check for added large files
        entry: uv run check-added-large-files
        language: system

      - id: check-yaml
        name: check yaml
        entry: uv run check-yaml
        language: system
        types: [yaml]

  # Coverage gate runs on push (not every commit) — needs the full suite,
  # which is slow with TensorFlow. Runs in the uv-managed environment.
  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest coverage >=80%
        entry: uv run pytest --cov=. --cov-fail-under=80
        language: system
        pass_filenames: false
        stages: [pre-push]
