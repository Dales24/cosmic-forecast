[project]
name = "cosmic-forecast"
version = "0.1.0"
description = "Telescope object detection, classification, and trajectory forecasting pipeline."
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "aiofiles",
    "numpy",
    # 2.17+ dropped macOS x86_64 wheels; pin to the last cross-platform release.
    # On Windows the `tensorflow-cpu` wheel is a 2 KB shim that pulls in
    # `tensorflow-intel` (the package that actually carries the binaries), so
    # depend on it directly there — the marker keeps macOS/Linux unchanged.
    "tensorflow-cpu==2.16.2; sys_platform != 'win32'",
    "tensorflow-intel==2.16.2; sys_platform == 'win32'",
    "pandas",
    "earthaccess",
    "h5py",
    "Pillow",
    "requests",
    "sgp4",
    "python-multipart",
    # Python 3.12 removed distutils from the stdlib; tensorflow 2.16 still imports
    # it. setuptools ships the shim that makes `import distutils` work — but only
    # versions < 74 still activate it standalone (newer ones dropped the hook).
    "setuptools<74",
]

[dependency-groups]
# Only needed to push a model to Hugging Face (scripts/publish_model.py);
# kept out of the runtime deps so the app and its image stay lean.
publish = [
    "huggingface_hub",
]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",  # required by fastapi/starlette TestClient in tests/test_api.py
    "black==24.4.2",  # keep in sync with .pre-commit-config.yaml
    "flake8==7.0.0",  # keep in sync with .pre-commit-config.yaml
    "pre-commit",
    # Hooks run from this venv rather than pre-commit-managed venvs, so the
    # utilities have to be installed here. Pinned to the former hook `rev`.
    "pre-commit-hooks==4.6.0",
]

# Application, not a distributable package — skip the build step.
[tool.uv]
package = false
# Copy installed files instead of hardlinking from the cache: hardlinks were
# dropping numpy's bundled .dylibs (libgfortran/openblas) on macOS, breaking imports.
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
